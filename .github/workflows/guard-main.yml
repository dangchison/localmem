# `main` takes pull requests from the repository owner only. Everything else goes to
# `develop`, which is the default branch and therefore what a new pull request targets
# unless someone deliberately changes it.
#
# This exists because GitHub has no native setting for "who may open a pull request
# against this branch". Branch protection governs merging, not opening, and the
# per-user push restrictions that would express this are available to
# organization-owned repositories only. So the rule is enforced here instead.
#
# `pull_request_target` rather than `pull_request`: a pull request from a fork gets a
# read-only token under `pull_request`, which cannot close anything. The usual danger of
# `pull_request_target` is that it runs with write permissions in the *base* repository's
# context while a naive workflow checks out and executes the *contributor's* code. This
# one never checks out any code and runs no contributor input, so that path does not
# exist here. Keep it that way: do not add `actions/checkout` to this file.
#
# It is inert for the owner's own pull requests, and it only ever closes — nothing is
# deleted and no branch is touched, so a mistake costs one `gh pr reopen`.
name: Guard main

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  redirect-to-develop:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Explain and close
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "Thanks for this — closing it here rather than leaving it in the wrong place.",
                "",
                "`main` only ever receives releases, opened by the repository owner. Contributions",
                "go to **`develop`**, which is the default branch, so re-opening this against",
                "`develop` is usually a one-click retarget rather than new work:",
                "",
                "```bash",
                `gh pr create --base develop --head ${pr.head.label}`,
                "```",
                "",
                "Nothing about the change itself is being judged here — this is purely about which",
                "branch it lands on. See CONTRIBUTING.md.",
              ].join("\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
